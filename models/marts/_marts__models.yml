version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      К заказу пристыкованы итоги по платежам; подтверждённая покупка — статус paid
      и хотя бы одна успешная оплата (возврат оплатой не считается).
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
        data_tests: [non_negative]
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]
      - name: items_count
        description: "Число разных товаров в заказе (не сумма quantity)."
        data_tests: [non_negative]



  - name: fct_order_items
    description: "Факт товаров в заказе: одна строка — один товар в заказе.
     Тестовые заказы исключены."
    columns:
      - name: order_item_id
        description: "Составной ключ позиции (order_id - product_id)."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Номер заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Товар."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: quantity
        description: "Количество единиц товара."
        data_tests: [non_negative]
      - name: unit_price
        description: "Цена за единицу."
      - name: discount_amount
        description: "Скидка на позицию."
      - name: line_amount
        description: "Сумма позиции после скидки."
        data_tests: [non_negative]
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

  - name: dim_customers
    description: 
      "Измерение клиентов, включая тех, кто ничего не купил: одна строка — один клиент.
      Показатели покупок считаются только по подтверждённым заказам."
    columns:
      - name: customer_id
        description: "Идентификатор клиента."
        data_tests: [unique, not_null]
      - name: registered_at
        description: "Дата и время регистрации клиента."
      - name: registration_date
        description: "Дата регистрации клиента."
      - name: city
        description: "Город клиента."
      - name: acquisition_channel
        description: "Канал привлечения клиента."
      - name: first_confirmed_order_id
        description: "Номер первой подтверждённой покупки; пусто, если покупок не было."
      - name: first_confirmed_at
        description: "Время первой подтверждённой покупки; пусто, если покупок не было."
      - name: confirmed_orders_count
        description: "Число подтверждённых заказов."
        data_tests: [non_negative]
      - name: confirmed_revenue
        description: "Сумма подтверждённых заказов."
        data_tests: [non_negative]
      - name: is_buyer
        description: "true, если у клиента есть хотя бы одна подтверждённая покупка."
        data_tests: [not_null]


  - name: dim_products
    description: "Измерение товаров: название бренд и иерархия (category_name > parent_category_name > root_category_name)."
    columns:
      - name: product_id
        description: "Идентификатор товара."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_name
        description: "Название категории товара (лист дерева)."
        data_tests: [not_null]
      - name: parent_category_name
        description: "Родительская категория."
      - name: root_category_name
        description: "Корневая категория (Home или Electronics)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Home', 'Electronics']



  - name: dim_dates
    description: "Календарь: одна строка — один день с 2026-03-01 по 2026-07-11.
      Покрывает все даты заказов."
    columns:
      - name: date_day
        description: "Календарная дата, ключ измерения."
        data_tests: [unique, not_null]
      - name: calendar_year
        description: "Год."
      - name: calendar_quarter
        description: "Квартал (1-4)."
      - name: calendar_month
        description: "Номер месяца (1-12)."
      - name: year_month
        description: "Месяц в формате ГГГГ-ММ."
      - name: day_of_week
        description: "День недели: 1 — понедельник, 7 — воскресенье."
      - name: day_name
        description: "Название дня недели на английском."
      - name: is_weekend
        description: "true для субботы и воскресенья, false иначе."
        data_tests: [not_null]